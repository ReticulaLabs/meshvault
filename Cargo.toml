[package]
name = "meshvault"
version = "0.1.0"
edition = "2024"
description = "Content-addressed, distributed file sharing over Reticulum mesh networks"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
env_logger = "0.11"
fs2 = "0.4"
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
log = "0.4"
rand_core = "0.10"
reticulum-sdk = { version = "2.3.13", default-features = false, features = ["alloc"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
